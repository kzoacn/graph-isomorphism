[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "babai-gi"
version = "0.1.0"
description = "A Python reference implementation of Babai's quasipolynomial graph isomorphism framework"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8"]
validation = ["pytest>=8", "networkx>=3"]

[tool.setuptools.packages.find]
include = ["babai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
